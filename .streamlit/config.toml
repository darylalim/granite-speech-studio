# No [theme] section on purpose: the app uses Streamlit's built-in light and
# dark themes, so the settings menu offers System / Light / Dark. Every theme
# option defaults to None (unset), which is what tells the frontend to apply its
# own palette — writing the default values back in would not be equivalent.
# A partial custom theme is worse than none: verified on 1.61.1 and 1.64.0, a
# [theme] table with nothing under [theme.light] or [theme.dark] drops the
# appearance section from the menu outright and locks the app to one mode.
# Either sub-table keeps the menu (the other mode is derived from [theme]), but
# the test demands both: a derived mode is one nobody reviewed. Both or neither.
#
# This block sits above [server] deliberately. TOML scoping is positional, so a
# key added under a comment that trails a table header joins that table — put
# theme options beneath a [theme] header of their own, not here.

[server]
maxUploadSize = 500
